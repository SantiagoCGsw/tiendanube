worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  server_tokens off;

  # Registro estructurado (JSON) para monitoreo y auditoría
  log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"upstream":"$upstream_addr","rt":$request_time}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  # Limitación de solicitudes (protección ante abuso, fuerza bruta y DoS)
  limit_req_zone $binary_remote_addr zone=api:10m   rate=300r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_status 429;

  # Balanceo de carga entre réplicas (Docker DNS devuelve una IP por réplica)
  upstream users     { server users:5000     max_fails=1 fail_timeout=10s; }
  upstream products  { least_conn; server products:5000  max_fails=1 fail_timeout=10s; }
  upstream inventory { server inventory:5000 max_fails=1 fail_timeout=10s; }
  upstream orders    { least_conn; server orders:5000    max_fails=1 fail_timeout=10s; }
  upstream monitor   { server monitor:5000; }

  # HTTP solo redirige a HTTPS
  server {
    listen 80;
    return 301 https://$host:8443$request_uri;
  }

  server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/tienda.crt;
    ssl_certificate_key /etc/nginx/certs/tienda.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Upstream $upstream_addr always;

    client_max_body_size 1m;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
    # Tolerancia a fallos: si una réplica falla, se reintenta en otra
    proxy_next_upstream error timeout http_502 http_503 non_idempotent;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    location / { root /usr/share/nginx/html; try_files $uri /index.html; }

    location /internal/ { return 403; }   # endpoints internos nunca se exponen

    location = /api/users/login { limit_req zone=login burst=5 nodelay; proxy_pass http://users; }
    location /api/users     { limit_req zone=api burst=300 nodelay; proxy_pass http://users; }
    location /api/products  { limit_req zone=api burst=300 nodelay; proxy_pass http://products; }
    location /api/inventory { limit_req zone=api burst=300 nodelay; proxy_pass http://inventory; }
    location /api/orders    { limit_req zone=api burst=300 nodelay; proxy_pass http://orders; }
    location = /status      { proxy_pass http://monitor/status; }
  }
}
